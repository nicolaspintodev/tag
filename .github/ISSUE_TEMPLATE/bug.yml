name: Bug
description: Reportar un comportamiento incorrecto
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. No incluyas credenciales, datos reales de clientes ni archivos `.env`.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: ¿Qué pasó y qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a ...
        2. Hacer clic en ...
        3. Ver el error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Navegador, sistema operativo, versión de PHP/Node, commit.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Pegar errores relevantes (sin datos sensibles).
    validations:
      required: false
